name: Build & Deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build web app
        run: npm ci && npm run build
        env:
          VITE_GA_ID: ${{ secrets.VITE_GA_ID }}

      - name: Test
        run: go vet ./... && go test ./...

      - name: Build binaries
        run: |
          VERSION="${GITHUB_REF_NAME}-${GITHUB_SHA::7}"
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$VERSION" -o "bin/jxlconverter-linux-$arch" .
          done
          (cd bin && sha256sum jxlconverter-linux-* > SHA256SUMS)
          ls -la bin

      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: bin/
          retention-days: 14

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: bin

      - name: Check deploy secrets
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          missing=""
          [ -z "$SSH_KEY" ]  && missing="$missing SSH_KEY"
          [ -z "$SSH_HOST" ] && missing="$missing SSH_HOST"
          [ -z "$SSH_USER" ] && missing="$missing SSH_USER"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (Settings → Secrets and variables → Actions)"
            exit 1
          fi

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::SSH_KNOWN_HOSTS not set; trusting host key from ssh-keyscan."
            ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" > ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Upload binary and restart service
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          OPTS="-i $HOME/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes"
          TARGET="$SSH_USER@$SSH_HOST"
          remote() { ssh $OPTS -p "$PORT" "$TARGET" "$@"; }

          case "$(remote uname -m)" in
            x86_64)        ARCH=amd64 ;;
            aarch64|arm64) ARCH=arm64 ;;
            *) echo "::error::Unsupported server architecture"; exit 1 ;;
          esac
          echo "Server architecture: $ARCH"

          remote 'mkdir -p ~/jxlconverter ~/.config/systemd/user'
          scp $OPTS -P "$PORT" "bin/jxlconverter-linux-$ARCH" "$TARGET:jxlconverter/jxlconverter.new"
          scp $OPTS -P "$PORT" deploy/jxlconverter.service "$TARGET:.config/systemd/user/jxlconverter.service"

          remote 'bash -s' <<'REMOTE'
          set -euo pipefail
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          cd ~/jxlconverter
          chmod 755 jxlconverter.new
          mv -f jxlconverter.new jxlconverter
          systemctl --user daemon-reload
          systemctl --user enable jxlconverter >/dev/null 2>&1
          systemctl --user restart jxlconverter
          if [ "$(loginctl show-user "$USER" -p Linger --value 2>/dev/null)" != "yes" ]; then
            echo "::warning::Linger is off: run 'sudo loginctl enable-linger $USER' once so the service survives logout/reboot."
          fi
          for i in 1 2 3 4 5; do
            if curl -fsS http://127.0.0.1:8090/up >/dev/null; then
              echo "Deployed $(./jxlconverter -version), healthy on 127.0.0.1:8090"
              exit 0
            fi
            sleep 1
          done
          systemctl --user status jxlconverter --no-pager || true
          exit 1
          REMOTE

      - name: Clean up key
        if: always()
        run: rm -f ~/.ssh/deploy_key

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: bin

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" bin/* \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
